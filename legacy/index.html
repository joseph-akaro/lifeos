<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS</title>
<style>
:root{
  --bg:#0d1017;--panel:#151a25;--panel2:#1c2333;--line:#283148;--text:#e8ebf3;--mute:#8d96ab;
  --accent:#7c5cff;--accent2:#a48bff;--good:#3ddc97;--bad:#ff6b6b;--gold:#ffc857;
  --time:#5aa9ff;--wealth:#3ddc97;--career:#ffb454;--skills:#b48cff;--vitality:#ff6b8a;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:light){
  :root{--bg:#f2f4fa;--panel:#fff;--panel2:#eef1f9;--line:#dde2ef;--text:#1a2033;--mute:#6a7390;--shadow:0 6px 24px rgba(40,50,90,.12);
  --time:#2b7de0;--wealth:#17a56b;--career:#d9820f;--skills:#8a58f0;--vitality:#e0405f;--gold:#d9a000}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:18px 12px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px;padding:4px 10px 14px;background:linear-gradient(90deg,var(--accent2),var(--time));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mute);font-weight:600}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--accent);color:#fff}
nav button .ic{font-size:18px;width:24px;text-align:center}
.wrap{padding:0 24px 40px;max-width:1100px;width:100%;margin:0 auto}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 12px}
.hud{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.avatar{font-size:30px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--panel2)}
.hud .mid{flex:1;min-width:0}
.hud .nm{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hud .nm small{color:var(--mute);font-weight:500}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel2);padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px;white-space:nowrap}
.icon-btn{border:0;background:var(--panel2);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .sub{color:var(--mute);font-weight:500;font-size:12px}
h2.pg{margin:8px 0 14px;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tile .v{font-size:24px;font-weight:800}
.tile .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.tile .s{color:var(--mute);font-size:12px}
.btn{border:0;background:var(--accent);color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:none;color:var(--bad);padding:4px 8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.row.end{justify-content:flex-end}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:12px}
.xp{font-size:12px;font-weight:700;color:var(--gold)}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;flex:none;color:#fff;font-weight:900;line-height:1}
.chk.on{background:var(--good);border-color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:18px 8px}
.areas .a{display:grid;grid-template-columns:100px 1fr 54px;gap:8px;align-items:center;margin:8px 0}
.areas .bar>i{background:var(--c)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--panel2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--panel2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--panel2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--panel2))}
.heat i.l4{background:var(--accent2)}
.heat i.fut{opacity:.25}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute)}
.bars .b .cols{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .b .cols i{display:block;width:100%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.timer{display:grid;place-items:center;gap:10px;padding:6px 0}
.ring{position:relative;width:190px;height:190px}
.ring svg{transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.strip{position:relative;height:30px;background:var(--panel2);border-radius:8px;overflow:hidden;margin-bottom:6px}
.strip i{position:absolute;top:0;bottom:0;opacity:.9}
.strip b{position:absolute;top:0;bottom:0;width:2px;background:var(--text)}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--mute)}
.trophy{text-align:center;padding:14px 8px;border-radius:14px;background:var(--panel2);border:1px solid transparent}
.trophy .e{font-size:32px;filter:grayscale(1);opacity:.35}
.trophy.got{border-color:var(--gold)}
.trophy.got .e{filter:none;opacity:1}
.trophy b{display:block;margin-top:4px}
.trophy small{color:var(--mute)}
.skill .big{font-size:30px}
.lvl{font-weight:800;color:var(--gold)}
#modal{position:fixed;inset:0;background:rgba(5,8,15,.65);display:none;place-items:center;z-index:50;padding:16px}
#modal.open{display:grid}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.mbox h3{margin:0 0 12px}
.mbox label{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
.mbox input,.mbox select,.mbox textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;text-transform:none;letter-spacing:0;font-weight:400}
.mbox textarea{min-height:70px;resize:vertical}
.mbox input:focus,.mbox select:focus,.mbox textarea:focus{outline:2px solid var(--accent);border-color:transparent}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;animation:in .25s}
@keyframes in{from{transform:translateY(10px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.seg{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:10px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--text)}
.goalbar{margin:6px 0}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:20;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
  .logo{display:none}
  nav button{flex-direction:column;gap:0;padding:6px 4px;font-size:10px;flex:1;align-items:center;text-align:center}
  .wrap{padding:0 16px 90px}
  .chips .chip.hide-s{display:none}
  .areas .a{grid-template-columns:80px 1fr 46px}
  #toasts{bottom:76px}
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <div class="wrap">
    <div id="top"></div>
    <main id="main"></main>
  </div>
</div>
<div id="modal"></div><div id="toasts"></div><canvas id="fx"></canvas>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const monthOf=s=>s.slice(0,7);
const addMonths=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const monthName=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleString(undefined,{month:'long',year:'numeric'})};
const mondayOf=s=>addDays(s,-((new Date(s+'T00:00:00').getDay()+6)%7));
const hm=min=>min>=60?`${Math.floor(min/60)}h ${min%60?pad(min%60)+'m':''}`.trim():`${min}m`;
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};

/* ============ model ============ */
const AREAS={
  time:{n:'Time',i:'⏱️',c:'var(--time)'},
  wealth:{n:'Wealth',i:'💰',c:'var(--wealth)'},
  career:{n:'Career',i:'💼',c:'var(--career)'},
  skills:{n:'Skills',i:'🧠',c:'var(--skills)'},
  vitality:{n:'Vitality',i:'💪',c:'var(--vitality)'}
};
const TITLES=['Rookie','Apprentice','Adventurer','Challenger','Veteran','Expert','Master','Champion','Legend','Mythic'];
const AVATARS=['🌱','🪴','🌿','🌳','⚔️','🛡️','🏹','👑','🐉','🌌'];
const EXP_CATS=['Food','Transport','Housing','Bills','Health','Fun','Learning','Shopping','Other'];
const INC_CATS=['Salary','Freelance','Business','Gift','Other'];
const SKILL_CATS=['Tech','Creative','Business','Language','Body','Other'];
const DIFF=[['1','Easy'],['2','Medium'],['3','Hard']];

const DEF=()=>({
  v:1,name:'Player One',cur:'$',xp:0,gold:0,areaXp:{},daily:{},log:[],
  habits:[
    {id:uid(),name:'Plan my day',area:'time',diff:1,done:[]},
    {id:uid(),name:'Move my body',area:'vitality',diff:2,done:[]},
    {id:uid(),name:'Learn something for 20 min',area:'skills',diff:2,done:[]},
    {id:uid(),name:'Check my money',area:'wealth',diff:1,done:[]}
  ],
  tasks:[],timer:null,focus:[],blocks:[],tx:[],txXp:{},budget:{},goals:[],skills:[],
  objectives:[],wins:[],reviews:[],trophies:{},
  rewards:[{id:uid(),name:'☕ Coffee break',cost:40},{id:uid(),name:'🎮 1h guilt-free gaming',cost:120},{id:uid(),name:'🍕 Treat meal',cost:300}],
  ui:{tab:'home',month:monthOf(today()),tf:'open'}
});
const KEY='lifeos.v1';
let S;
function load(){
  try{const r=localStorage.getItem(KEY);S=r?Object.assign(DEF(),JSON.parse(r)):DEF();}catch(e){S=DEF();}
  S.ui=Object.assign({tab:'home',month:monthOf(today()),tf:'open'},S.ui);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ============ game engine ============ */
const lvl=xp=>Math.floor(Math.sqrt(xp/40))+1;
const xpFor=l=>40*(l-1)*(l-1);
const areaLvl=a=>Math.floor(Math.sqrt((S.areaXp[a]||0)/25))+1;
const skillMin=id=>S.focus.filter(f=>f.skillId===id).reduce((a,f)=>a+f.min,0);
const skillLvl=m=>Math.floor(Math.sqrt(m/30))+1;
const skillMinFor=l=>30*(l-1)*(l-1);

function award(amt,area,why){
  const before=lvl(S.xp);
  S.xp=Math.max(0,S.xp+amt);S.gold=Math.max(0,S.gold+amt);
  S.areaXp[area]=Math.max(0,(S.areaXp[area]||0)+amt);
  const t=today();S.daily[t]=(S.daily[t]||0)+amt;
  if(amt>0){S.log.unshift({t:Date.now(),xp:amt,area,why});S.log.length=Math.min(S.log.length,60);}
  toast(`${amt>0?'+':''}${amt} XP · ${why}`);
  const after=lvl(S.xp);
  if(after>before){confetti();toast(`🎉 LEVEL UP! You are now level ${after}`,true);}
  checkTrophies();
}
function gstreak(){
  let d=today(),n=0;
  if(!(S.daily[d]>0))d=addDays(d,-1);
  while(S.daily[d]>0){n++;d=addDays(d,-1);}
  return n;
}
function habitStreak(h){
  let d=today(),n=0;const s=new Set(h.done);
  if(!s.has(d))d=addDays(d,-1);
  while(s.has(d)){n++;d=addDays(d,-1);}
  return n;
}
const monthTx=(m,type)=>S.tx.filter(t=>t.date.startsWith(m)&&(!type||t.type===type));
const sum=a=>a.reduce((x,t)=>x+t.amt,0);
const fmt=n=>(n<0?'-':'')+S.cur+Math.abs(Number(n)).toLocaleString(undefined,{maximumFractionDigits:2});
const totalFocus=()=>S.focus.reduce((a,f)=>a+f.min,0);

const TROPHIES=[
  {id:'first',i:'🌟',n:'First Steps',d:'Earn your first XP',t:()=>S.xp>0},
  {id:'lv5',i:'⭐',n:'Level 5',d:'Reach level 5',t:()=>lvl(S.xp)>=5},
  {id:'lv10',i:'🌠',n:'Level 10',d:'Reach level 10',t:()=>lvl(S.xp)>=10},
  {id:'st7',i:'🔥',n:'Week Warrior',d:'7-day XP streak',t:()=>gstreak()>=7},
  {id:'st30',i:'☄️',n:'Unstoppable',d:'30-day XP streak',t:()=>gstreak()>=30},
  {id:'hab21',i:'🧬',n:'Habit Forged',d:'21-day streak on any habit',t:()=>S.habits.some(h=>habitStreak(h)>=21)},
  {id:'q25',i:'⚔️',n:'Quest Slayer',d:'Complete 25 quests',t:()=>S.tasks.filter(t=>t.done).length>=25},
  {id:'f10',i:'🎯',n:'Deep Diver',d:'10 hours of focus',t:()=>totalFocus()>=600},
  {id:'f50',i:'🧘',n:'Flow State',d:'50 hours of focus',t:()=>totalFocus()>=3000},
  {id:'tx20',i:'📒',n:'Bookkeeper',d:'Log 20 transactions',t:()=>S.tx.length>=20},
  {id:'goal',i:'🏦',n:'Goal Getter',d:'Fully fund a savings goal',t:()=>S.goals.some(g=>g.paid)},
  {id:'bud',i:'🛡️',n:'Budget Boss',d:'Finish a month with 5+ expenses, all budgets respected',t:()=>{
      const m=S.ui.month;const ex=monthTx(m,'expense');const ks=Object.keys(S.budget);
      return ex.length>=5&&ks.length>0&&ks.every(k=>sum(ex.filter(t=>t.cat===k))<=S.budget[k]);}},
  {id:'sk5',i:'🛠️',n:'Specialist',d:'Get any skill to level 5',t:()=>S.skills.some(s=>skillLvl(skillMin(s.id))>=5)},
  {id:'sk3',i:'🎓',n:'Polymath',d:'Three skills at level 3+',t:()=>S.skills.filter(s=>skillLvl(skillMin(s.id))>=3).length>=3},
  {id:'obj',i:'🚀',n:'Mission Complete',d:'Finish a career objective',t:()=>S.objectives.some(o=>o.done)},
  {id:'win10',i:'🏅',n:'Win Collector',d:'Log 10 career wins',t:()=>S.wins.length>=10},
  {id:'rev4',i:'🔭',n:'Reflective',d:'Complete 4 weekly reviews',t:()=>S.reviews.length>=4}
];
let checking=false;
function checkTrophies(){
  if(checking)return;checking=true;
  for(const t of TROPHIES){
    if(!S.trophies[t.id]&&t.t()){
      S.trophies[t.id]=today();
      toast(`🏆 Trophy unlocked: ${t.n}`,true);confetti();
      award(50,'career','Trophy: '+t.n);
    }
  }
  checking=false;
}

/* ============ ui plumbing ============ */
function toast(msg,big){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  if(big)el.style.borderLeftColor='var(--accent2)';
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),big?3800:2200);
}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML='';}
function form(title,fields,ok,btn='Save'){
  const m=$('#modal');
  const inp=f=>{
    const req=f.req===false?'':'required';
    if(f.t==='select')return `<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    if(f.t==='textarea')return `<textarea name="${f.k}" ${req} placeholder="${esc(f.ph||'')}">${esc(f.v||'')}</textarea>`;
    return `<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.dl?`list="dl_${f.k}"`:''} ${f.t==='number'?'step="any" min="0"':''} ${req} autocomplete="off">`+
      (f.dl?`<datalist id="dl_${f.k}">${f.dl.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:'');
  };
  m.innerHTML=`<div class="mbox"><h3>${title}</h3><form id="f">${fields.map(f=>`<label>${f.l}${inp(f)}</label>`).join('')}
    <div class="row end"><button type="button" class="btn ghost" data-a="close">Cancel</button><button class="btn">${btn}</button></div></form></div>`;
  m.classList.add('open');
  $('#f').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));closeModal();ok(v);save();render();};
  const first=m.querySelector('input,select,textarea');if(first)first.focus();
}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function confetti(){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#7c5cff','#ffc857','#3ddc97','#ff6b8a','#5aa9ff','#ffb454'];
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:Math.random()*7+4,c:cols[Math.random()*cols.length|0],r:Math.random()*6}));
  let f=0;
  (function step(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
    if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);
  })();
}
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.8);o.start();o.stop(a.currentTime+.8);}catch(e){}}

/* ============ shared render bits ============ */
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%;${c?`background:${c}`:''}"></div>`;
const areaDot=a=>`<span class="dot" style="background:${AREAS[a].c}" title="${AREAS[a].n}"></span>`;
const areaOpts=Object.entries(AREAS).map(([k,v])=>[k,v.i+' '+v.n]);

function radar(){
  const keys=Object.keys(AREAS),lv=keys.map(areaLvl),mx=Math.max(5,...lv),cx=110,cy=110,R=78;
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return [cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f];};
  const ring=f=>keys.map((_,i)=>pt(i,f).join(',')).join(' ');
  const poly=keys.map((_,i)=>pt(i,lv[i]/mx).join(',')).join(' ');
  return `<svg viewBox="0 0 220 220" width="100%" style="max-width:260px;display:block;margin:auto">
    ${[.33,.66,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)"/>`).join('')}
    ${keys.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="var(--line)"/>`).join('')}
    <polygon points="${poly}" fill="var(--accent)" fill-opacity=".35" stroke="var(--accent2)" stroke-width="2"/>
    ${keys.map((k,i)=>{const [x,y]=pt(i,1.27);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--mute)">${AREAS[k].i} ${lv[i]}</text>`}).join('')}
  </svg>`;
}

/* ============ timer ============ */
function finishTimer(partial){
  const tm=S.timer;if(!tm)return;
  const el=partial?Math.floor((Date.now()-tm.start)/60000):tm.min;
  S.timer=null;
  if(el>=1){
    S.focus.push({date:today(),min:el,skillId:tm.skillId||'',label:tm.label||'Focus'});
    award(el,tm.skillId?'skills':'time',`${el} min focus${tm.label?' · '+tm.label:''}`);
  }else toast('Under 1 minute — nothing banked');
  if(!partial)beep();
  save();render();
}
function tick(){
  const tm=S.timer;if(!tm)return;
  const total=tm.min*60000,left=tm.start+total-Date.now();
  if(left<=0){finishTimer(false);return;}
  const d=$('#tdisp'),r=$('#tring');
  if(d){const s=Math.ceil(left/1000);d.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;}
  if(r){const C=2*Math.PI*84;r.setAttribute('stroke-dashoffset',C*(1-(total-left)/total));}
}
setInterval(tick,1000);

const A={
  close:closeModal,
  tab:id=>{S.ui.tab=id;window.scrollTo(0,0);},
  tf:id=>{S.ui.tf=id;},
  month:id=>{S.ui.month=addMonths(S.ui.month,+id);},
  settings:()=>form('Settings',[
      {k:'name',l:'Your name',v:S.name},{k:'cur',l:'Currency symbol',v:S.cur}],
    v=>{S.name=v.name;S.cur=v.cur;},'Save')||addSettingsExtras(),
  habit:id=>{
    const h=S.habits.find(x=>x.id===id),t=today(),i=h.done.indexOf(t);
    if(i<0){h.done.push(t);award(h.diff*10,h.area,h.name);}
    else{h.done.splice(i,1);award(-h.diff*10,h.area,'Undo: '+h.name);}
  },
  addHabit:()=>form('New habit',[{k:'name',l:'Habit',ph:'e.g. Read 10 pages'},{k:'area',l:'Life area',t:'select',o:areaOpts,v:'vitality'},{k:'diff',l:'Difficulty (10/20/30 XP)',t:'select',o:DIFF,v:'1'}],
    v=>S.habits.push({id:uid(),name:v.name.trim(),area:v.area,diff:+v.diff,done:[]}),'Add habit'),
  delHabit:id=>{if(confirm('Delete this habit?'))S.habits=S.habits.filter(h=>h.id!==id);save();},
  addTask:()=>form('New quest',[{k:'text',l:'Quest',ph:'e.g. Send invoice to client'},{k:'area',l:'Life area',t:'select',o:areaOpts,v:'career'},{k:'diff',l:'Difficulty (15/30/45 XP)',t:'select',o:DIFF,v:'1'},{k:'due',l:'Due date (optional)',t:'date',req:false}],
    v=>S.tasks.push({id:uid(),text:v.text.trim(),area:v.area,diff:+v.diff,due:v.due||'',done:false}),'Add quest'),
  task:id=>{
    const x=S.tasks.find(t=>t.id===id);x.done=!x.done;
    award(x.done?x.diff*15:-x.diff*15,x.area,(x.done?'':'Undo: ')+x.text);
    if(x.done&&S.tasks.filter(t=>!t.done).length===0)toast('🧹 Quest board cleared!',true);
  },
  delTask:id=>{S.tasks=S.tasks.filter(t=>t.id!==id);save();},
  startTimer:(id)=>{
    const go=(min,label,skillId)=>{S.timer={start:Date.now(),min:+min,label,skillId:skillId||''};};
    const sk=[['','— no skill —'],...S.skills.map(s=>[s.id,s.icon+' '+s.name])];
    const fields=[{k:'label',l:'What are you working on?',req:false,ph:'Deep work'},{k:'skillId',l:'Practice a skill?',t:'select',o:sk}];
    if(id==='custom')fields.unshift({k:'min',l:'Minutes',t:'number',v:30});
    form('Start focus',fields,v=>go(id==='custom'?Math.max(1,+v.min):id,v.label,v.skillId),'Start');
  },
  stopTimer:()=>finishTimer(true),
  logFocus:()=>form('Log focus time',[{k:'min',l:'Minutes',t:'number',v:30},{k:'label',l:'What',req:false},{k:'skillId',l:'Skill',t:'select',o:[['','— none —'],...S.skills.map(s=>[s.id,s.icon+' '+s.name])]},{k:'date',l:'Date',t:'date',v:today()}],
    v=>{const m=Math.max(1,Math.round(+v.min));S.focus.push({date:v.date,min:m,skillId:v.skillId,label:v.label});award(m,v.skillId?'skills':'time',`${m} min logged`);}),
  addBlock:()=>form('New time block',[{k:'label',l:'What',ph:'Write proposal'},{k:'area',l:'Area',t:'select',o:areaOpts,v:'career'},{k:'start',l:'Start',t:'time',v:'09:00'},{k:'end',l:'End',t:'time',v:'10:00'}],
    v=>{if(toMin(v.end)<=toMin(v.start)){toast('End must be after start');return;}S.blocks.push({id:uid(),date:today(),label:v.label.trim(),area:v.area,start:v.start,end:v.end,done:false});},'Add block'),
  block:id=>{const b=S.blocks.find(x=>x.id===id);b.done=!b.done;award(b.done?10:-10,b.area,(b.done?'':'Undo: ')+b.label);},
  delBlock:id=>{S.blocks=S.blocks.filter(b=>b.id!==id);save();},

  addTx:()=>form('New transaction',[{k:'type',l:'Type',t:'select',o:[['expense','Expense'],['income','Income']],v:'expense'},{k:'amt',l:'Amount',t:'number'},
      {k:'cat',l:'Category',dl:[...EXP_CATS,...INC_CATS],ph:'Food, Salary…'},{k:'note',l:'Note (optional)',req:false},{k:'date',l:'Date',t:'date',v:today()}],
    v=>{
      const amt=+v.amt;if(!(amt>0))return;
      S.tx.push({id:uid(),type:v.type,amt,cat:v.cat.trim()||'Other',note:v.note,date:v.date});
      S.ui.month=monthOf(v.date);
      const c=S.txXp[today()]||0;if(c<3){S.txXp[today()]=c+1;award(5,'wealth','Logged '+v.type);}
    },'Add'),
  delTx:id=>{S.tx=S.tx.filter(t=>t.id!==id);save();},
  setBudget:()=>form('Monthly budget',[{k:'cat',l:'Category',dl:EXP_CATS},{k:'limit',l:'Monthly limit',t:'number'}],v=>{S.budget[v.cat.trim()]=+v.limit;}),
  delBudget:id=>{delete S.budget[id];save();},
  addGoal:()=>form('New savings goal',[{k:'name',l:'Goal',ph:'Emergency fund'},{k:'target',l:'Target amount',t:'number'},{k:'saved',l:'Already saved',t:'number',v:0}],
    v=>{if(+v.target>0)S.goals.push({id:uid(),name:v.name.trim(),target:+v.target,saved:+v.saved||0,paid:false});},'Create goal'),
  fundGoal:id=>{const g=S.goals.find(x=>x.id===id);form('Add to '+esc(g.name),[{k:'amt',l:'Amount',t:'number'}],v=>{
      g.saved+=+v.amt;award(20,'wealth','Funded '+g.name);
      if(g.saved>=g.target&&!g.paid){g.paid=true;award(200,'wealth','Goal reached: '+g.name);confetti();}
    },'Add funds');},
  delGoal:id=>{if(confirm('Delete this goal?'))S.goals=S.goals.filter(g=>g.id!==id);save();},

  addSkill:()=>form('New skill',[{k:'name',l:'Skill',ph:'Python, Spanish, Public speaking…'},{k:'icon',l:'Emoji',v:'🧠'},{k:'cat',l:'Category',t:'select',o:SKILL_CATS.map(c=>[c,c])}],
    v=>S.skills.push({id:uid(),name:v.name.trim(),icon:v.icon||'🧠',cat:v.cat}),'Add skill'),
  practice:id=>{const s=S.skills.find(x=>x.id===id);form('Log practice: '+esc(s.name),[{k:'min',l:'Minutes practiced',t:'number',v:30},{k:'note',l:'What did you do?',req:false}],
    v=>{const m=Math.max(1,Math.round(+v.min)),b=skillLvl(skillMin(id));S.focus.push({date:today(),min:m,skillId:id,label:v.note||s.name});award(m,'skills',`${s.name} +${m}m`);
        if(skillLvl(skillMin(id))>b)toast(`${s.icon} ${s.name} reached Lv ${skillLvl(skillMin(id))}!`,true);},'Log');},
  focusSkill:id=>{const s=S.skills.find(x=>x.id===id);S.ui.tab='time';S.timer={start:Date.now(),min:25,label:s.name,skillId:id};},
  delSkill:id=>{if(confirm('Delete this skill? Logged time stays in your focus history.'))S.skills=S.skills.filter(s=>s.id!==id);save();},

  addObj:()=>form('New objective',[{k:'title',l:'Objective',ph:'Get AWS certified'},{k:'due',l:'Target date (optional)',t:'date',req:false}],v=>S.objectives.push({id:uid(),title:v.title.trim(),due:v.due||'',steps:[],done:false,paid:false}),'Create'),
  delObj:id=>{if(confirm('Delete this objective?'))S.objectives=S.objectives.filter(o=>o.id!==id);save();},
  addStep:id=>{const o=S.objectives.find(x=>x.id===id);form('Add step',[{k:'text',l:'Step'}],v=>{o.steps.push({id:uid(),text:v.text.trim(),done:false});o.done=false;});},
  step:key=>{
    const [oid,sid]=key.split('|'),o=S.objectives.find(x=>x.id===oid),s=o.steps.find(x=>x.id===sid);
    s.done=!s.done;award(s.done?15:-15,'career',(s.done?'':'Undo: ')+s.text);
    const all=o.steps.every(x=>x.done);o.done=all;
    if(all&&!o.paid){o.paid=true;award(100,'career','Objective complete: '+o.title);confetti();}
  },
  addWin:()=>form('Log a career win',[{k:'text',l:'What did you achieve?',t:'textarea'}],v=>{S.wins.unshift({d:today(),text:v.text.trim()});award(10,'career','Career win');}),
  review:()=>form('Weekly review',[{k:'win',l:'Biggest win this week',t:'textarea'},{k:'lesson',l:'What did I learn?',t:'textarea'},{k:'next',l:'Top focus for next week',t:'textarea'}],
    v=>{S.reviews.unshift({wk:mondayOf(today()),win:v.win,lesson:v.lesson,next:v.next});award(40,'career','Weekly review');},'Complete review'),

  addReward:()=>form('New reward',[{k:'name',l:'Reward',ph:'🍦 Ice cream'},{k:'cost',l:'Cost in 🪙',t:'number',v:100}],v=>S.rewards.push({id:uid(),name:v.name.trim(),cost:Math.round(+v.cost)})),
  delReward:id=>{S.rewards=S.rewards.filter(r=>r.id!==id);save();},
  buy:id=>{const r=S.rewards.find(x=>x.id===id);if(S.gold<r.cost)return;S.gold-=r.cost;toast(`Enjoy: ${r.name} 🎉`,true);confetti();},

  exportData:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`lifeos-backup-${today()}.json`;a.click();},
  importData:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{S=Object.assign(DEF(),JSON.parse(t));save();closeModal();render();toast('Backup restored');}catch(e){toast('Invalid backup file');}});};i.click();},
  resetAll:()=>{if(confirm('Erase ALL LifeOS data and start over? Export a backup first!')){S=DEF();save();closeModal();}}
};
function addSettingsExtras(){
  const f=$('#f');if(!f)return;
  f.insertAdjacentHTML('beforeend',`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="row wrap-r"><button type="button" class="btn ghost sm" data-a="exportData">⬇ Export backup</button><button type="button" class="btn ghost sm" data-a="importData">⬆ Import backup</button><button type="button" class="btn danger" data-a="resetAll">Reset all</button></div>`);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(!fn)return;
  fn(el.dataset.id,el);
  if(!$('#modal').classList.contains('open')||el.dataset.a==='close'||el.dataset.a==='resetAll'){save();render();}
});

load();render();checkTrophies();save();
</script>
</body>
</html>
